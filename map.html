<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Tower – Map</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design/map.css">
<link rel="stylesheet" href="design/cube.css">
</head>

<body>

<!-- Animated background blobs (matches tutorial) -->
<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>
<div class="bg-blob blob3"></div>

<!-- Floating equation canvas (JS builds this) -->
<div class="bg-layer" id="bgLayer"></div>

<!-- Floating sparkle emojis (injected by inline script below) -->
<!-- <div id="sparkleContainer"></div> -->

<!-- ── Sticky Header ── -->
<div class="header">
  <div class="header-title">
    <span class="mascot">🏰</span>
    Math Tower
  </div>

  <div class="header-right">
    <div class="hbadge">⭐ <span id="starCount">0</span></div>
    <div class="hbadge">🎯 <span id="scoreCount">0</span></div>
    <div class="hbadge">🌍 World 1</div>
  </div>
</div>

<!-- JS tile layer -->
<div id="tileLayer"></div>

<!-- Map -->
<div class="map-wrap" id="mapWrap">
  <div id="roadSvgLayer" class="road-svg-layer"></div>
  <canvas id="roadCanvas"></canvas>
  <div id="scaleWrap">
    <div id="decorLayer" class="decorLayer"></div>
  </div>
</div>

<!-- Scroll hint -->
<button class="scroll-hint" id="findLevelBtn">▼ Find my level</button>

<!-- Level Modal -->
<div class="modal-bg" id="modal">
  <div class="modal-card">
    <h2 id="modalTitle">Level 1</h2>
    <p id="modalDesc">Easy · Number Tower</p>
    <div class="modal-stars" id="modalStars">★★★</div>
    <div class="modal-btns">
      <button class="btn-play" id="playBtn">▶ Play!</button>
      <button class="btn-close" id="closeBtn">✕ Close</button>
    </div>
  </div>
</div>

<!-- Sparkle + mascot scripts (no module needed) -->
<script>
  /* ── Floating sparkle emojis ── */
  (function spawnSparkles() {
    const emojis = ['✨','⭐','🌟','💫','🎯','🎲','🎮','🌈','➕','✖️','🔢'];
    const container = document.getElementById('sparkleContainer');
    for (let i = 0; i < 14; i++) {
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.cssText = `
        left: ${Math.random() * 100}vw;
        animation-duration: ${8 + Math.random() * 10}s;
        animation-delay: ${-Math.random() * 14}s;
        font-size: ${15 + Math.random() * 14}px;
        opacity: ${0.28 + Math.random() * 0.3};
      `;
      container.appendChild(el);
    }
  })();

  /* ── Mascot bob click-to-spin ── */
  document.querySelector('.mascot')?.addEventListener('click', function () {
    this.style.animation = 'none';
    void this.offsetWidth;
    this.style.animation = 'mascotSpin 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
    setTimeout(() => { this.style.animation = 'mascotBob 2.4s ease-in-out infinite'; }, 700);
  });
</script>

<script type="module" src="mechanics/map.js"></script>

</body>
</html>
